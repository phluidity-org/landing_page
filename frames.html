<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Section frames</title>
<style>
html,body{margin:0;background:#f6f8fb;overflow:hidden}
#grid{display:grid;grid-auto-flow:column;justify-content:start}
.cell{position:relative;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px #cfd7e2}
.cell iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0}
.cell b{position:absolute;z-index:5;left:0;bottom:0;background:#0b3cff;color:#fff;
  font:600 10px/1 -apple-system;letter-spacing:.12em;text-transform:uppercase;padding:5px 8px}
</style></head><body><div id="grid"></div>
<script>
/* Each cell is a real, independently scrolled instance of the page, held at a
   fixed offset. The harness never scrolls, so a screenshot cannot disturb it.
   ?src=index.html|baseline.html  ?at=a,b,c,d (anchor indices) */
const q=new URLSearchParams(location.search);
const src=q.get('src')||'index.html';
const at=(q.get('at')||'2,2.5,3,4').split(',').map(Number);
const VW=+(q.get('w')||1280), VH=+(q.get('h')||720), K=+(q.get('k')||0.5);
const grid=document.getElementById('grid');
grid.style.gridAutoFlow='row';
grid.style.gridTemplateColumns='repeat('+Math.max(1,Math.floor(1280/(VW*K)))+',auto)';
document.head.insertAdjacentHTML('beforeend','<style>.cell{width:'+VW*K+'px;height:'+VH*K+'px}'
  +'.cell iframe{width:'+VW+'px;height:'+VH+'px;transform:scale('+K+')}</style>');
const LABEL=['hero','problem','introducing phluidity','before / after','leadership','contact'];
at.forEach(a=>{
  const cell=document.createElement('div'); cell.className='cell';
  const f=document.createElement('iframe'); f.src=src;
  const b=document.createElement('b');
  b.textContent=Number.isInteger(a)?LABEL[a]:('between '+LABEL[Math.floor(a)]+' + '+LABEL[Math.ceil(a)]);
  cell.appendChild(f); cell.appendChild(b); grid.appendChild(cell);
  f.addEventListener('load',()=>{
    const w=f.contentWindow,d=f.contentDocument;
    d.documentElement.style.scrollBehavior='auto';
    const cols=[...d.querySelectorAll('section .col')];
    function anchor(i){
      const r=cols[i].getBoundingClientRect();
      return i===0?0:r.top+w.scrollY+r.height/2-w.innerHeight*0.5;
    }
    /* ?open=0,5 expands those team rows, so a still frame can show the hover
       state that a screenshot could never catch */
    const op=(q.get('open')||'').split(',').filter(s=>s!=='');
    if(op.length){
      const ps=d.querySelectorAll('.person');
      op.forEach(i=>{const p=ps[+i]; if(p){p.classList.add('open');
        const b=p.querySelector('.ptoggle'); if(b) b.setAttribute('aria-expanded','true');}});
      d.querySelectorAll('img[data-src]').forEach(im=>{im.src=im.getAttribute('data-src');im.removeAttribute('data-src');});
    }
    const settle=()=>{
      const lo=Math.floor(a),hi=Math.ceil(a);
      const y=lo===hi?anchor(lo):anchor(lo)+(anchor(hi)-anchor(lo))*(a-lo);
      w.scrollTo(0,y);
    };
    settle(); setTimeout(settle,400); setTimeout(settle,1200);
  });
});
</script></body></html>
